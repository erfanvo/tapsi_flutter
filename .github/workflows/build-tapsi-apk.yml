name: Build Tapsi Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Detect Flutter project directory
        run: |
          if [ -f pubspec.yaml ]; then
            echo "FLUTTER_DIR=." >> "$GITHUB_ENV"
          elif [ -f tapsi_flutter/pubspec.yaml ]; then
            echo "FLUTTER_DIR=tapsi_flutter" >> "$GITHUB_ENV"
          else
            echo "Flutter project not found: pubspec.yaml is missing." >&2
            exit 1
          fi

      - name: Create Android host files if needed
        run: |
          cd "$FLUTTER_DIR"

          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name=tapsi_client
          fi

      - name: Allow Android network access
        run: |
          cd "$FLUTTER_DIR"

          manifest="android/app/src/main/AndroidManifest.xml"

          if ! grep -q 'android.permission.INTERNET' "$manifest"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$manifest"
          fi

      - name: Install dependencies
        run: |
          cd "$FLUTTER_DIR"
          flutter pub get

      - name: Analyze
        run: |
          cd "$FLUTTER_DIR"
          flutter analyze

      - name: Build release APK
        run: |
          cd "$FLUTTER_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tapsi-client-release-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
          if-no-files-found: error
